spring.application.name=eureka-service
server.port=8761
# Le serveur EST l'annuaire : il ne s'enregistre pas lui-meme
eureka.client.register-with-eureka=false
# ... et n'a pas besoin de telecharger la liste des services
eureka.client.fetch-registry=false
# Reglages pour le TP : retirer rapidement les instances arretees.
# Verification toutes les 5 s (defaut : 60 s), auto-preservation desactivee.
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.enable-self-preservation=false