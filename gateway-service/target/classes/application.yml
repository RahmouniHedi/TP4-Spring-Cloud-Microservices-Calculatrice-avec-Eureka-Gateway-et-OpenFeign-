server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Routes statiques (etapes E.2 / E.3 / E.4)
          # routes:
          #   - id: route-calcul
          #     uri: lb://CALCUL-SERVICE
          #     predicates:
          #       - Path=/calcul/**
          #   - id: route-historique
          #     uri: lb://HISTORIQUE-SERVICE
          #     predicates:
          #       - Path=/operations/**
          #   - id: doc-calcul
          #     uri: lb://CALCUL-SERVICE
          #     predicates:
          #       - Path=/docs/calcul
          #     filters:
          #       - SetPath=/v3/api-docs
          #   - id: doc-historique
          #     uri: lb://HISTORIQUE-SERVICE
          #     predicates:
          #       - Path=/docs/historique
          #     filters:
          #       - SetPath=/v3/api-docs
          discovery:
            locator:
              # Une route par service present dans l'annuaire (etape E.5)
              enabled: true
              # Noms Eureka en majuscules ; acceptes en minuscules dans l'URI
              lower-case-service-id: true
      loadbalancer:
        cache:
          ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: "*"

# Swagger UI de la passerelle : http://localhost:8888/swagger-ui.html
springdoc:
  swagger-ui:
    # Routes dynamiques : chaque description est lue par la route du service (etape E.5)
    urls:
      - name: calcul-service
        url: /calcul-service/v3/api-docs
      - name: historique-service
        url: /historique-service/v3/api-docs
